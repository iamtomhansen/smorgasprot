[package]
name = "smorgasprot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive 2D/3D protein interface cartography & triage GUI"

[dependencies]
smorgasprot-core.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
# "glow" (OpenGL) stays enabled on native as a fallback/escape hatch; on wasm32, eframe picks
# WebPainterGlow whenever "glow" is active, so omit "glow" there and enable wgpu's "webgl"
# feature so WebPainterWgpu falls back from WebGPU to WebGL2 automatically.
egui-wgpu = "0.31.1"
wgpu = "24.0"
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.31", features = ["serde"] }
ron = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", features = ["persistence", "wgpu"] }
rfd = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "persistence", "wgpu", "web_screen_reader"] }
wgpu = { version = "24.0", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
